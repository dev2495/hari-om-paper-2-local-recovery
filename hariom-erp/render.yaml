services:
  - type: web
    name: hariom-analytics-service
    runtime: python
    rootDir: services/analytics-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AUTH_SERVICE_URL
        sync: false
      - key: INTERNAL_EVENT_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        sync: false
      - key: OWNER_PACK_OUTPUT_DIR
        value: /var/data/owner-pack
      # P1.9 — Render cron below is the canonical owner-pack trigger. Disable
      # the in-process APScheduler owner-pack job so customers never receive
      # the same daily email twice. The in-process scheduler still runs to
      # provide the hourly heartbeat that powers /scheduler/status.
      - key: OWNER_PACK_IN_PROCESS
        value: "false"

  # Render schedules use UTC; 14:30 UTC is 20:00 IST.
  - type: cron
    name: hariom-owner-pack-daily
    runtime: python
    rootDir: services/analytics-service
    schedule: "30 14 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.daily_owner_pack
    envVars:
      - key: AUTH_SERVICE_URL
        sync: false
      - key: INTERNAL_EVENT_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        sync: false
      - key: OWNER_PACK_OUTPUT_DIR
        value: /var/data/owner-pack
